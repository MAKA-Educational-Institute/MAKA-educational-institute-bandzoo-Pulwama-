<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maulana Abul Kalam Azad Educational Institute | Bandzoo, Pulwama</title>

<meta name="description" content="Official school information website for Maulana Abul Kalam Azad Educational Institute, Bandzoo, Pulwama, Jammu and Kashmir.">
<meta name="theme-color" content="#075c49">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ROOT
========================================================= */

:root{
    --green:#075c49;
    --green-dark:#043d31;
    --green-light:#0c8065;
    --yellow:#facc15;
    --blue:#0284c7;

    --white:#ffffff;
    --bg:#f6f9f8;
    --dark:#14231f;
    --text:#334155;
    --muted:#64748b;
    --border:#e2e8f0;

    --shadow-sm:0 5px 18px rgba(0,0,0,.06);
    --shadow:0 15px 40px rgba(0,0,0,.10);
    --shadow-lg:0 25px 60px rgba(0,0,0,.15);

    --radius:18px;
    --radius-lg:28px;
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--dark);
    line-height:1.6;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

section{
    padding:100px 0;
}

.section-heading{
    text-align:center;
    max-width:700px;
    margin:0 auto 55px;
}

.section-heading .small-title{
    color:var(--green-light);
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:10px;
}

.section-heading h2{
    font-size:42px;
    line-height:1.15;
    margin-bottom:14px;
    color:var(--green-dark);
}

.section-heading p{
    color:var(--muted);
    font-size:16px;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,.06);
    transition:.3s;
}

.navbar{
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.school-logo-svg{
    width:58px;
    height:65px;
    flex-shrink:0;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.12));
}

.school-name{
    font-size:13px;
    line-height:1.25;
    font-weight:800;
    color:var(--green-dark);
    max-width:210px;
    text-transform:uppercase;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:4px;
    list-style:none;
}

.nav-links a{
    display:block;
    padding:10px 12px;
    font-size:13px;
    font-weight:700;
    color:#334155;
    border-radius:10px;
    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    background:#e8f5f1;
    color:var(--green);
}

.menu-btn{
    display:none;
    font-size:28px;
    color:var(--green);
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    text-align:center;
    color:white;
    padding-top:120px;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.10),transparent 25%),
    radial-gradient(circle at 85% 80%,rgba(14,165,233,.25),transparent 30%),
    linear-gradient(135deg,#043d31 0%,#075c49 55%,#075985 100%);
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-180px;
    top:-150px;
}

.hero::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:50%;
    left:-150px;
    bottom:-150px;
}

.hero-content{
    position:relative;
    z-index:2;
    width:min(950px,92%);
    margin:auto;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 18px;
    border-radius:50px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(10px);
    font-size:13px;
    font-weight:700;
    margin-bottom:25px;
    animation:fadeDown .8s ease;
}

.hero h1{
    font-size:clamp(38px,6vw,65px);
    line-height:1.05;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:22px;
    animation:fadeUp .9s ease;
}

.hero h1 span{
    color:var(--yellow);
}

.hero-location{
    font-size:19px;
    font-weight:700;
    color:#e0f2fe;
    margin-bottom:12px;
}

.tagline{
    max-width:720px;
    margin:0 auto 35px;
    color:#dbeafe;
    font-size:17px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 27px;
    border-radius:50px;
    font-size:14px;
    font-weight:800;
    transition:.3s;
}

.btn-primary{
    background:var(--yellow);
    color:#17202a;
    box-shadow:0 10px 25px rgba(250,204,21,.2);
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(250,204,21,.3);
}

.btn-outline{
    border:1.5px solid rgba(255,255,255,.65);
    color:white;
    background:rgba(255,255,255,.05);
}

.btn-outline:hover{
    background:white;
    color:var(--green);
    transform:translateY(-3px);
}

/* =========================================================
   QUICK STATS
========================================================= */

.quick-info{
    position:relative;
    margin-top:-65px;
    z-index:20;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.stat-card{
    background:white;
    padding:28px 20px;
    text-align:center;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid #edf2f0;
    transition:.3s;
}

.stat-card:hover{
    transform:translateY(-7px);
}

.stat-icon{
    font-size:29px;
    margin-bottom:8px;
}

.stat-number{
    font-size:32px;
    font-weight:900;
    color:var(--green);
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* =========================================================
   ABOUT
========================================================= */

.about{
    background:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-visual{
    min-height:420px;
    border-radius:var(--radius-lg);
    background:
        linear-gradient(135deg,rgba(7,92,73,.95),rgba(2,132,199,.9));
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
}

.about-visual::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border:2px solid rgba(255,255,255,.12);
    border-radius:50%;
}

.about-symbol{
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
}

.about-symbol .cap{
    font-size:90px;
}

.about-symbol h3{
    font-size:24px;
    margin-top:10px;
}

.about-content .small-title{
    color:var(--green-light);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:13px;
}

.about-content h2{
    font-size:40px;
    line-height:1.15;
    color:var(--green-dark);
    margin:12px 0 20px;
}

.about-content p{
    color:var(--muted);
    margin-bottom:18px;
}

.about-points{
    display:grid;
    gap:13px;
    margin-top:25px;
}

.about-point{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    color:#334155;
}

.about-point span{
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#dcfce7;
    color:#15803d;
    font-size:14px;
}

/* =========================================================
   ACADEMICS
========================================================= */

.academics{
    background:#f6faf8;
}

.cards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.info-box{
    background:white;
    border:1px solid var(--border);
    padding:30px;
    border-radius:var(--radius);
    transition:.3s;
    box-shadow:var(--shadow-sm);
}

.info-box:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.info-box .box-icon{
    width:55px;
    height:55px;
    display:grid;
    place-items:center;
    border-radius:15px;
    background:#e8f5f1;
    font-size:25px;
    margin-bottom:20px;
}

.info-box h3{
    font-size:20px;
    color:var(--green-dark);
    margin-bottom:8px;
}

.info-box p{
    color:var(--muted);
    font-size:14px;
}

/* =========================================================
   WHY SCHOOL
========================================================= */

.why{
    background:white;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    padding:28px 20px;
    text-align:center;
    border-radius:var(--radius);
    background:#f8fafc;
    border:1px solid var(--border);
    transition:.3s;
}

.why-card:hover{
    transform:translateY(-6px);
    background:#f0fdf9;
}

.why-card .icon{
    font-size:36px;
    margin-bottom:14px;
}

.why-card h3{
    font-size:17px;
    color:var(--green-dark);
    margin-bottom:7px;
}

.why-card p{
    font-size:13px;
    color:var(--muted);
}

/* =========================================================
   FACILITIES
========================================================= */

.facilities{
    background:linear-gradient(135deg,#043d31,#075c49);
    color:white;
}

.facilities .section-heading h2,
.facilities .section-heading p,
.facilities .section-heading .small-title{
    color:white;
}

.facility-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.facility{
    padding:30px;
    border-radius:var(--radius);
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    transition:.3s;
}

.facility:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.14);
}

.facility-icon{
    font-size:35px;
    margin-bottom:15px;
}

.facility h3{
    font-size:19px;
    margin-bottom:7px;
}

.facility p{
    color:#d1fae5;
    font-size:13px;
}

/* =========================================================
   ACHIEVEMENTS
========================================================= */

.achievements{
    background:#f6faf8;
}

.achievement-list{
    max-width:850px;
    margin:auto;
    display:grid;
    gap:15px;
}

.achievement{
    display:flex;
    align-items:center;
    gap:18px;
    padding:22px;
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-sm);
}

.achievement-icon{
    width:52px;
    height:52px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:#fef9c3;
    font-size:24px;
}

.achievement h3{
    font-size:17px;
    color:var(--green-dark);
}

.achievement p{
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   GALLERY
========================================================= */

.gallery{
    background:white;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.gallery-card{
    height:230px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(135deg,#075c49,#0284c7);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    transition:.3s;
}

.gallery-card:hover{
    transform:scale(1.02);
}

.gallery-card span{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:18px;
    font-size:15px;
    font-weight:800;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    padding-top:55px;
}

/* =========================================================
   ADMISSION
========================================================= */

.admission{
    background:#f6faf8;
}

.admission-box{
    background:white;
    border-radius:var(--radius-lg);
    padding:50px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:30px;
    align-items:center;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.admission-box h2{
    color:var(--green-dark);
    font-size:34px;
    margin-bottom:10px;
}

.admission-box p{
    color:var(--muted);
    max-width:700px;
}

/* =========================================================
   CONTACT
========================================================= */

.contact{
    background:white;
}

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.contact-card{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:35px;
}

.contact-item{
    display:flex;
    gap:16px;
    margin-bottom:24px;
}

.contact-item:last-child{
    margin-bottom:0;
}

.contact-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:#e8f5f1;
    font-size:20px;
    flex-shrink:0;
}

.contact-item h3{
    font-size:15px;
    color:var(--green-dark);
}

.contact-item p{
    color:var(--muted);
    font-size:14px;
}

.map-box{
    min-height:330px;
    border-radius:var(--radius);
    background:
        radial-gradient(circle at center,rgba(2,132,199,.2),transparent 45%),
        linear-gradient(135deg,#e0f2fe,#dcfce7);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1px solid var(--border);
}

.map-content{
    color:var(--green-dark);
}

.map-content .map-icon{
    font-size:55px;
}

.map-content h3{
    margin:10px 0 5px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    background:#032b23;
    color:white;
    padding:65px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;
    gap:50px;
    padding-bottom:45px;
}

.footer-brand h2{
    font-size:22px;
    margin-bottom:12px;
}

.footer-brand p{
    color:#b7d8d0;
    font-size:13px;
    max-width:450px;
}

footer h3{
    font-size:15px;
    margin-bottom:15px;
}

.footer-links{
    list-style:none;
    display:grid;
    gap:9px;
}

.footer-links a{
    color:#b7d8d0;
    font-size:13px;
    transition:.2s;
}

.footer-links a:hover{
    color:white;
}

.footer-bottom{
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:22px;
    display:flex;
    justify-content:space-between;
    gap:15px;
    color:#91b9b0;
    font-size:12px;
}

/* =========================================================
   SCROLL TO TOP
========================================================= */

#topBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:var(--green);
    color:white;
    font-size:18px;
    cursor:pointer;
    display:none;
    z-index:900;
    box-shadow:var(--shadow);
}

#topBtn.show{
    display:block;
}

/* =========================================================
   ANIMATION
========================================================= */

.reveal{
    opacity:0;
    transform:translateY(30px);
    transition:opacity .7s ease,transform .7s ease;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .nav-links{
        gap:0;
    }

    .nav-links a{
        padding:9px 8px;
        font-size:12px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .why-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:850px){

    .menu-btn{
        display:block;
    }

    .nav-links{
        position:absolute;
        top:82px;
        left:0;
        width:100%;
        display:none;
        flex-direction:column;
        align-items:stretch;
        background:white;
        padding:15px;
        box-shadow:var(--shadow);
    }

    .nav-links.active{
        display:flex;
    }

    .nav-links a{
        padding:13px;
        font-size:14px;
    }

    .about-grid,
    .contact-grid{
        grid-template-columns:1fr;
    }

    .cards-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .facility-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .gallery-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .admission-box{
        grid-template-columns:1fr;
        text-align:center;
    }

    .admission-box .btn{
        justify-self:center;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    section{
        padding:75px 0;
    }

    .navbar{
        min-height:72px;
    }

    .school-logo-svg{
        width:48px;
        height:55px;
    }

    .school-name{
        font-size:11px;
        max-width:170px;
    }

    .nav-links{
        top:72px;
    }

    .hero{
        padding-top:105px;
    }

    .hero h1{
        letter-spacing:-1px;
    }

    .hero-location{
        font-size:16px;
    }

    .tagline{
        font-size:14px;
    }

    .section-heading h2{
        font-size:31px;
    }

    .stats-grid,
    .cards-grid,
    .why-grid,
    .facility-grid,
    .gallery-grid{
        grid-template-columns:1fr;
    }

    .about-visual{
        min-height:320px;
    }

    .about-content h2{
        font-size:31px;
    }

    .admission-box{
        padding:30px 22px;
    }

    .admission-box h2{
        font-size:27px;
    }

    .footer-grid{
        grid-template-columns:1fr;
        gap:30px;
    }

    .footer-bottom{
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>
